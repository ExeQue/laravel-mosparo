<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1952px; height: 544px; overflow: hidden; }
  body {
    position: relative;
    font-family: Inter, sans-serif;
    background:
      radial-gradient(ellipse 650px 420px at 470px 290px, rgba(88, 75, 188, .38), transparent 70%),
      radial-gradient(ellipse 620px 320px at 1380px 270px, rgba(88, 75, 188, .14), transparent 70%),
      #0d0b1a;
    color: #fff;
  }

  /* blurred window behind */
  .window {
    position: absolute; left: 300px; top: 40px; width: 640px; height: 430px;
    border-radius: 18px; background: #17142a; border: 1px solid #2a2547;
    transform: rotate(-4deg); filter: blur(3.5px); opacity: .75;
    box-shadow: 0 40px 80px rgba(0,0,0,.5);
  }
  .window .dots { position: absolute; left: 22px; top: 18px; display: flex; gap: 9px; }
  .window .dots i { width: 13px; height: 13px; border-radius: 50%; display: block; }
  .window .line { position: absolute; left: 60px; height: 14px; border-radius: 7px; background: #2c2848; }

  /* the form card */
  .card {
    position: absolute; left: 505px; top: 86px; width: 440px; height: 372px;
    border-radius: 20px; background: linear-gradient(180deg, #1b1833, #131126);
    border: 1px solid #332d5c; transform: rotate(-4deg);
    box-shadow: 0 30px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(136,123,233,.10), 0 0 90px rgba(88,75,188,.25);
    padding: 34px 36px;
  }
  .label { font: 500 13px 'JetBrains Mono', monospace; color: #8f88b8; margin-bottom: 8px; letter-spacing: .02em; }
  .field { height: 40px; border-radius: 10px; background: #0f0d1e; border: 1px solid #2f2950; margin-bottom: 20px;
           font: 400 15px 'JetBrains Mono', monospace; color: #d6d2f2; padding: 10px 14px; }
  .field.area { height: 64px; }
  .box {
    display: flex; align-items: center; gap: 14px; height: 58px; border-radius: 12px;
    border: 1.5px solid #2f8f5b; background: rgba(47,143,91,.1); padding: 0 16px;
  }
  .tick { width: 30px; height: 30px; border-radius: 50%; background: #2fbf71; display: grid; place-items: center;
          box-shadow: 0 0 22px rgba(47,191,113,.55); }
  .box span { font: 500 14px Inter, sans-serif; color: #b9f3d2; }
  .box b { margin-left: auto; font: 600 12px 'JetBrains Mono', monospace; color: #b1adf4; letter-spacing: .08em; }
  .button { margin-top: 20px; width: 120px; height: 40px; border-radius: 10px; background: #584bbc;
            font: 600 15px Inter, sans-serif; display: grid; place-items: center; box-shadow: 0 8px 24px rgba(88,75,188,.5); }

  /* shield */
  .mo { position: absolute; left: 40px; top: 18px; width: 520px; transform: rotate(-6deg); filter: drop-shadow(0 30px 40px rgba(20,12,60,.55)) drop-shadow(0 0 60px rgba(136,123,233,.35)); }

  /* spam */
  .spam { position: absolute; filter: drop-shadow(0 6px 12px rgba(0,0,0,.5)); }
  .trail { position: absolute; height: 2px; border-radius: 2px; transform-origin: left center; }

  /* text */
  .text { position: absolute; left: 1000px; top: 0; height: 544px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .lockup { display: flex; align-items: center; gap: 18px; opacity: .95; }
  .lockup .x { font: 300 40px Inter, sans-serif; color: #6a6494; }
  .title { font: 700 108px/1 Inter, sans-serif; letter-spacing: -.04em; white-space: nowrap; }
  .title .dim { color: #887be9; font-weight: 500; }
  .tagline { font: 400 30px Inter, sans-serif; color: #a39fc2; white-space: nowrap; }
  .tagline em { font-style: normal; color: #b1adf4; }
</style>
</head>
<body>
  <div class="window">
    <div class="dots"><i style="background:#e06c5b"></i><i style="background:#e5b84a"></i><i style="background:#5cc46c"></i></div>

    <div class="line" style="top:360px;left:600px;width:220px"></div>

    <div class="field">ada@example.com</div>

    <path d="M4 6l28 20L60 6" fill="none" stroke="#ff6b6b" stroke-width="2.5" stroke-linejoin="round"/>
  </svg>
